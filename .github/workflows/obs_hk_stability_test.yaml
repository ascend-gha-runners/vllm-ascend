name: obs-hk-stability-test

on:
  workflow_dispatch:
    inputs:
      payload_mb:
        description: Payload object size in MB
        type: number
        default: 50
      readers:
        description: Number of concurrent reader jobs
        type: number
        default: 20
      downloads_per_reader:
        description: Repeated downloads per reader job
        type: number
        default: 5
      runner_pool:
        description: JSON array of {tag, region, image} objects, image = business-like job container, readers spread round-robin
        type: string
        default: '[{"tag": "linux-amd64-cpu-test-8-hk", "region": "hk", "image": "quay.io/ascend-ci/vllm-ascend:lint"}, {"tag": "linux-amd64-cpu-test-16-hk", "region": "hk", "image": "quay.io/ascend-ci/vllm-ascend:lint"}, {"tag": "linux-aarch64-a3-test-2-cn12-001", "region": "cn12-via-liqo-gy005", "image": "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12"}]'
      delete_payload:
        description: Delete the test object from OBS when finished
        type: boolean
        default: true

concurrency:
  group: obs-hk-stability-test
  cancel-in-progress: false

env:
  OBS_ENDPOINT: https://obs.ap-southeast-1.myhuaweicloud.com
  OBS_BUCKET: ascend-ci-cache-hk
  OBS_REGION: ap-southeast-1

jobs:
  prepare:
    name: upload payload & plan readers
    runs-on: linux-amd64-cpu-test-8-hk
    timeout-minutes: 15
    env:
      HW_OBS_AK: ${{ secrets.HW_OBS_AK_HK }}
      HW_OBS_SK: ${{ secrets.HW_OBS_SK_HK }}
    outputs:
      object_key: ${{ steps.upload.outputs.object_key }}
      sha256: ${{ steps.upload.outputs.sha256 }}
      upload_mbps: ${{ steps.upload.outputs.upload_mbps }}
      matrix: ${{ steps.upload.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Check python3
        run: python3 -V

      - name: Upload payload and build matrix
        id: upload
        run: |
          python3 .github/workflows/scripts/obs_stability/prepare.py \
            --endpoint "$OBS_ENDPOINT" \
            --bucket "$OBS_BUCKET" \
            --region "$OBS_REGION" \
            --key "obs-stability/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/payload-${{ inputs.payload_mb }}mb.bin" \
            --size-mb "${{ inputs.payload_mb }}" \
            --readers "${{ inputs.readers }}" \
            --runner-pool '${{ inputs.runner_pool }}' \
            --output-file "$GITHUB_OUTPUT"

  read:
    name: read-${{ matrix.reader_id }} (${{ matrix.region }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container:
      image: ${{ matrix.image }}
    env:
      HW_OBS_AK: ${{ secrets.HW_OBS_AK_HK }}
      HW_OBS_SK: ${{ secrets.HW_OBS_SK_HK }}
    steps:
      - uses: actions/checkout@v4

      - name: Check python3
        run: python3 -V

      - name: Raw curl timing probes
        run: |
          mkdir -p /tmp/obs-test
          if ! command -v curl >/dev/null 2>&1; then
            echo "curl not available, skipping probes" > /tmp/obs-test/curl.txt
            exit 0
          fi
          BASE="https://${OBS_BUCKET}.${OBS_ENDPOINT#https://}/"
          for i in $(seq 1 5); do
            curl -o /dev/null -s --max-time 30 \
              -w '%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}\n' \
              "$BASE" >> /tmp/obs-test/curl.txt || echo "000 0 0 0 0 -1" >> /tmp/obs-test/curl.txt
          done
          cat /tmp/obs-test/curl.txt

      - name: Download payload ${{ inputs.downloads_per_reader }}x
        run: |
          python3 .github/workflows/scripts/obs_stability/read.py \
            --endpoint "$OBS_ENDPOINT" \
            --bucket "$OBS_BUCKET" \
            --region "$OBS_REGION" \
            --key "${{ needs.prepare.outputs.object_key }}" \
            --sha256 "${{ needs.prepare.outputs.sha256 }}" \
            --downloads "${{ inputs.downloads_per_reader }}" \
            --region-label "${{ matrix.region }}" \
            --reader-id "${{ matrix.reader_id }}" \
            --runner-tag "${{ matrix.runner }}" \
            --out /tmp/obs-test/result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.reader_id }}
          path: /tmp/obs-test/

  report:
    name: aggregate report
    needs: [prepare, read]
    if: always() && needs.prepare.result == 'success'
    runs-on: linux-amd64-cpu-test-8-hk
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results

      - name: Summary
        run: |
          python3 .github/workflows/scripts/obs_stability/report.py results \
            "${{ needs.prepare.outputs.object_key }}" \
            "${{ needs.prepare.outputs.upload_mbps }}" | tee /tmp/obs-report.md
          cat /tmp/obs-report.md >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: delete test object
    needs: [prepare, read]
    if: always() && inputs.delete_payload && needs.prepare.result == 'success'
    runs-on: linux-amd64-cpu-test-8-hk
    timeout-minutes: 10
    env:
      HW_OBS_AK: ${{ secrets.HW_OBS_AK_HK }}
      HW_OBS_SK: ${{ secrets.HW_OBS_SK_HK }}
    steps:
      - uses: actions/checkout@v4

      - name: Delete payload
        run: |
          python3 .github/workflows/scripts/obs_stability/s3obj.py delete \
            --key "${{ needs.prepare.outputs.object_key }}"
