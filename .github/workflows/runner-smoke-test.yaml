name: Runner Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runner-smoke-test.yaml'

permissions:
  contents: read

jobs:
  smoke-test:
    name: "Smoke test — linux-amd64-a5-8"
    runs-on: linux-amd64-a5-8
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-950-ubuntu22.04-py3.12

    steps:
      - name: System info
        run: |
          echo "=== System Info ==="
          echo "Hostname: $(hostname)"
          echo "Arch:    $(uname -m)"
          echo "Kernel:  $(uname -r)"
          echo "OS:      $(cat /etc/os-release | head -5)"

      - name: NPU info
        run: |
          echo "=== NPU Info ==="
          npu-smi info || echo "WARNING: npu-smi not available"

      - name: Disk & memory
        run: |
          echo "=== Disk ==="
          df -h / /tmp 2>/dev/null || true
          echo ""
          echo "=== Memory ==="
          free -h || true

      - name: Cache dir contents
        run: |
          echo "=== /root/.cache ==="
          ls -la /root/.cache 2>/dev/null || echo "WARNING: /root/.cache not available"

      - name: Network
        run: |
          echo "=== DNS ==="
          cat /etc/resolv.conf || true
          echo ""
          echo "=== cache service reachable ==="
          curl -fsSL --max-time 10 http://cache-service.nginx-pypi-cache > /dev/null 2>&1 \
            && echo "OK: cache-service reachable" \
            || echo "WARN: cache-service NOT reachable"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Clone sgl-kernel-npu
        run: |
          git clone https://github.com/sgl-project/sgl-kernel-npu.git

      - name: Build deepep (Ascend950)
        run: |
          cd sgl-kernel-npu
          bash build.sh -a deepep Ascend950

      - name: Install deep-ep wheel
        run: |
          cd sgl-kernel-npu
          pip install output/deep*

      - name: Fix missing deep_ep_cpp module
        run: |
          if python3 -c "import deep_ep_cpp" >/dev/null 2>&1; then
            echo "OK: deep_ep_cpp importable"
          else
            echo "WARN: no module named deep_ep_cpp, creating symlink..."
            cd "$(pip show deep-ep | grep -E '^Location:' | awk '{print $2}')" && ln -s deep_ep/deep_ep_cpp*.so && cd -
          fi

      - name: Run deepep intranode test
        run: |
          python3 sgl-kernel-npu/tests/python/deepep/test_intranode.py \
            --num-processes=2 \
            --num-tokens=256 \
            --num-experts=32 \
            --quant-type=mx_fp4_e2m1

      - name: All checks passed
        run: |
          echo ""
          echo "=========================================="
          echo "  Runner linux-amd64-a5-8 smoke test"
          echo "  ALL CHECKS PASSED ✓"
          echo "=========================================="
