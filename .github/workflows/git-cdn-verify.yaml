name: git-cdn-verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/git-cdn-verify.yaml'

permissions:
  contents: read

jobs:
  benchmark-git-cdn:
    name: "git-cdn full clone benchmark (aarch64)"
    runs-on: linux-aarch64-cpu-2-gitcdn-test
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12

    steps:
      - name: Verify insteadOf rule
        run: |
          echo "=== Checking git-cdn insteadOf rule ==="
          cat /root/.gitconfig
          echo ""
          grep -q 'insteadOf.*https://github.com/' /root/.gitconfig || {
            echo "ERROR: insteadOf rule not found in /root/.gitconfig"
            exit 1
          }
          grep -qE 'git-cdn-service\.git-cdn\.svc|git-cdn\.test\.osinfra\.cn' /root/.gitconfig || {
            echo "ERROR: git-cdn service URL not found in insteadOf rule"
            exit 1
          }
          echo "PASS: git-cdn insteadOf rule is present"

      - name: Test actions/checkout by commit SHA
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: main
          path: vllm-checkout

      - name: Verify SHA checkout result
        run: |
          cd vllm-checkout
          echo "HEAD: $(git rev-parse HEAD)"
          echo "PASS: actions/checkout by SHA works through git-cdn (allowReachableSHA1InWant effective)"

      - name: Test fetch non-tip commit SHA
        run: |
          mkdir -p /tmp/sha-test && cd /tmp/sha-test
          git init
          git fetch https://github.com/vllm-project/vllm.git refs/heads/main
          PARENT_SHA=$(git rev-parse FETCH_HEAD^)
          echo "HEAD tip: $(git rev-parse FETCH_HEAD)"
          echo "Parent (non-tip) SHA: $PARENT_SHA"
          echo "Fetching non-tip SHA through git-cdn..."
          git fetch origin "$PARENT_SHA" 2>&1 | tee /tmp/fetch-output.txt
          if grep -q "not our ref" /tmp/fetch-output.txt; then
            echo "FAIL: 'not our ref' — allowReachableSHA1InWant not effective"
            exit 1
          fi
          echo "PASS: Non-tip SHA fetch succeeded — allowReachableSHA1InWant is working"

      - name: Test fetch unreachable PR merge commit SHA
        run: |
          mkdir -p /tmp/unreachable-test && cd /tmp/unreachable-test
          git init
          UNREACHABLE_SHA="d4f4d3f40fc5350a71777fcb0e5eb8a57bda631f"
          echo "Testing fetch of unreachable PR merge commit: $UNREACHABLE_SHA"
          echo "This SHA is NOT in git-cdn cache and NOT reachable from any ref."
          echo "git-cdn should use fetch_sha fallback to fetch it from upstream."
          echo ""
          echo "Fetching..."
          git fetch https://github.com/vllm-project/vllm.git "$UNREACHABLE_SHA" 2>&1 | tee /tmp/unreachable-output.txt
          EXIT_CODE=$?
          echo ""
          echo "Exit code: $EXIT_CODE"
          if grep -q "not our ref" /tmp/unreachable-output.txt; then
            echo "FAIL: 'not our ref' — fetch_sha fallback not working"
            exit 1
          fi
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FAIL: git fetch exited with non-zero code"
            exit 1
          fi
          echo "PASS: Unreachable SHA fetch succeeded — fetch_sha fallback is working"

      - name: Test gitcode.com repo fetch via git-cdn-gitcode
        run: |
          mkdir -p /tmp/gitcode-test && cd /tmp/gitcode-test
          git init
          echo "=== Fetching mindspore from gitcode.com via git-cdn-gitcode ==="
          echo "insteadOf should redirect gitcode.com → git-cdn-gitcode service"
          echo ""
          echo "Fetching refs/heads/master..."
          git fetch https://gitcode.com/mindspore/mindspore.git refs/heads/master 2>&1 | tee /tmp/gitcode-output.txt
          EXIT_CODE=$?
          echo ""
          echo "Exit code: $EXIT_CODE"
          if grep -q "not our ref" /tmp/gitcode-output.txt; then
            echo "FAIL: 'not our ref' — git-cdn-gitcode not working"
            exit 1
          fi
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FAIL: git fetch from gitcode.com failed"
            exit 1
          fi
          echo "Fetched SHA: $(git rev-parse FETCH_HEAD)"
          echo "PASS: gitcode.com repo fetch via git-cdn-gitcode succeeded"

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  git-cdn SHA Fetch Verify Summary"
          echo "=========================================="
          echo ""
          echo "Runner: linux-aarch64-cpu-2-gitcdn-test"
          echo ""
          echo "1. insteadOf rule: see step 1"
          echo "2. actions/checkout by SHA: see step 2-3"
          echo "3. non-tip SHA fetch (allowReachableSHA1InWant): see step 4"
          echo "4. unreachable SHA fetch (fetch_sha fallback): see step 5"
          echo "5. gitcode.com fetch (git-cdn-gitcode): see step 6"
          echo "=========================================="
