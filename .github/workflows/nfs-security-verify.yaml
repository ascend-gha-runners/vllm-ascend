name: nfs-security-verify

on:
  workflow_dispatch:
    inputs:
      nfs_host:
        description: 'NFS server IP to test (SFS Turbo internal IP)'
        required: false
        default: '172.16.0.165'

jobs:
  verify-nfs-root-path-not-mountable:
    runs-on: linux-aarch64-cpu-2-gitcdn-test
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    steps:
      - name: Install NFS client tools
        run: |
          apt-get update -qq && apt-get install -y -qq nfs-common 2>/dev/null || true
          export PATH="/usr/sbin:/sbin:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Check NFS exports with showmount
        env:
          NFS_HOST: ${{ github.event.inputs.nfs_host || '172.16.0.165' }}
        run: |
          echo "=== NFS Security Verification ==="
          echo "Testing NFS server: ${NFS_HOST}"
          echo ""

          which showmount || { echo "ERROR: showmount not available"; exit 1; }

          echo "--- showmount -e ${NFS_HOST} ---"
          EXPORTS=$(showmount -e "${NFS_HOST}" 2>&1 || true)
          echo "${EXPORTS}"
          echo ""

          # Check if root path '/' is exported
          if echo "${EXPORTS}" | grep -qE '^\s*/\s'; then
            echo "=========================================="
            echo "FAIL: NFS root path '/' is EXPORTED!"
            echo "=========================================="
            echo "The SFS Turbo root path is in the export list."
            echo "Any pod can mount the entire SFS Turbo root path and pollute artifact packages."
            exit 1
          fi

          # Check if wildcard or overly broad exports exist
          if echo "${EXPORTS}" | grep -qE '^\s*/\S*\s+\*'; then
            echo "WARN: Broad NFS export detected with wildcard access."
          fi

          echo "=========================================="
          echo "PASS: NFS root path '/' is NOT exported."
          echo "=========================================="

      - name: Attempt direct NFS mount of root path
        env:
          NFS_HOST: ${{ github.event.inputs.nfs_host || '172.16.0.165' }}
        run: |
          echo "=== Attempting direct NFS mount of root path ==="
          mkdir -p /tmp/nfs-root-test

          # Try to mount the root path
          MOUNT_OUTPUT=$(mount -t nfs "${NFS_HOST}:/" /tmp/nfs-root-test 2>&1) || true
          MOUNT_EXIT=$?
          echo "mount exit code: ${MOUNT_EXIT}"
          echo "mount output: ${MOUNT_OUTPUT}"

          if [ ${MOUNT_EXIT} -eq 0 ]; then
            echo ""
            echo "Listing root mount contents:"
            ls -la /tmp/nfs-root-test/ 2>&1 || true
            echo ""
            echo "=========================================="
            echo "FAIL: NFS root path is MOUNTABLE!"
            echo "=========================================="
            echo "Successfully mounted ${NFS_HOST}:/ and listed directory contents."
            echo "This means the NFS root path privilege escalation vulnerability still exists."
            umount /tmp/nfs-root-test 2>/dev/null || true
            exit 1
          else
            echo ""
            echo "=========================================="
            echo "PASS: NFS root path is NOT mountable."
            echo "=========================================="
            echo "Mount attempt failed, root path access is denied."
          fi

      - name: Summary
        run: |
          echo "=== Verification Complete ==="
          echo "NFS server tested: ${NFS_HOST}"
          echo "Vulnerability: NFS root path privilege escalation via mountable root path"
          echo "Fix: Replace csi-sfsturbo + absolute-path with sfsturbo-subpath-sc"
        env:
          NFS_HOST: ${{ github.event.inputs.nfs_host || '172.16.0.165' }}
