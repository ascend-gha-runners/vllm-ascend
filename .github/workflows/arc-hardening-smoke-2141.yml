name: arc-hardening-smoke-2141
on:
  workflow_dispatch:
  push:
    branches: [arc-2141-smoke]
jobs:
  smoke:
    runs-on: linux-arm64-cpu-test-24
    container:
      image: m.daocloud.io/docker.io/library/alpine:3.20
    steps:
      - name: probe
        run: |
          set +e
          echo "== identity =="; id; uname -m
          echo "== SA token =="; ls /var/run/secrets/kubernetes.io/serviceaccount 2>&1 || echo NO_TOKEN_MOUNTED
          echo "== k8s api =="; (wget -q -T 5 -O /dev/null https://kubernetes.default.svc/version && echo API_REACHABLE) || echo API_UNREACHABLE
          echo "== cache mount =="; grep " /root/.cache " /proc/mounts || echo NOT_MOUNTED
          echo "== cache content (b46afb97 hot data) =="; ls /root/.cache | head -6; ls /root/.cache 2>/dev/null | wc -l
          echo "== write test =="; (echo smoke > /root/.cache/.arc2141-smoke && rm /root/.cache/.arc2141-smoke && echo WRITE_OK) || echo READONLY_BY_TEMPLATE_DESIGN
