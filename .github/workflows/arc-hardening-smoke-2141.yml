name: arc-hardening-smoke-2141
on:
  workflow_dispatch:
  push:
    branches: [arc-2141-smoke]
jobs:
  smoke:
    runs-on: linux-arm64-cpu-test-24
    steps:
      - name: probe
        run: |
          echo "== identity =="; id; uname -m
          echo "== SA token =="; ls /var/run/secrets/kubernetes.io/serviceaccount 2>&1
          echo "== k8s api =="; (curl -sk --max-time 5 https://kubernetes.default.svc/version || echo API_UNREACHABLE) | tail -1
          echo "== /root/.cache mount source =="; grep " /root/.cache " /proc/mounts || echo NOT_MOUNTED
          echo "== cache content =="; ls /root/.cache | head -5; ls /root/.cache | wc -l
          echo "== write test =="; echo smoke > /root/.cache/.arc2141-smoke && cat /root/.cache/.arc2141-smoke && rm /root/.cache/.arc2141-smoke && echo WRITE_OK
          echo "== traversal =="; ls /root/.cache/../ >/dev/null 2>&1 && ls /root/.cache | head -1
