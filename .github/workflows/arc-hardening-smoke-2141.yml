name: arc-hardening-smoke-2141
on:
  workflow_dispatch:
  push:
    branches: [arc-2141-smoke]
jobs:
  smoke:
    runs-on: linux-arm64-cpu-test-24
    container:
      image: m.daocloud.io/docker.io/library/alpine:3.20
    steps:
      - name: probe
        run: |
          echo "== identity =="; id; uname -m
          echo "== SA token =="; ls /var/run/secrets/kubernetes.io/serviceaccount 2>&1
          echo "== k8s api =="; wget -q -T 5 -O- https://kubernetes.default.svc/version 2>&1 || echo API_UNREACHABLE
          echo "== cache mount =="; grep " /root/.cache " /proc/mounts || echo NOT_MOUNTED
          echo "== cache content =="; ls /root/.cache 2>&1 | head -6; ls /root/.cache 2>/dev/null | wc -l
          echo "== write test =="; echo smoke > /root/.cache/.arc2141-smoke && cat /root/.cache/.arc2141-smoke && rm /root/.cache/.arc2141-smoke && echo WRITE_OK
