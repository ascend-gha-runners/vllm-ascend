name: arc-hardening-sweep-smoke
on:
  workflow_dispatch:
  push:
    branches: [arc-2141-sweep-smoke]
jobs:
  cn12-local:
    runs-on: linux-aarch64-a3-test-4-cn12-001
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-cpu
    steps:
      - run: |
          set +e
          echo "expect share 37cbefa6 via host bind"
          ls /var/run/secrets/kubernetes.io/serviceaccount 2>&1 || echo NO_TOKEN_MOUNTED
          grep " /root/.cache " /proc/mounts | awk '{print $1, $3, $4}'
          ls /root/.cache | wc -l
          (echo s > /root/.cache/.arc2141-sweep && rm /root/.cache/.arc2141-sweep && echo WRITE_OK) || echo WRITE_FAIL
  hk-cpu:
    runs-on: linux-amd64-cpu-test-8-hk
    container:
      image: m.daocloud.io/docker.io/library/alpine:3.20
    steps:
      - run: |
          set +e
          echo "expect share 24dd126e via host bind"
          ls /var/run/secrets/kubernetes.io/serviceaccount 2>&1 || echo NO_TOKEN_MOUNTED
          grep " /root/.cache " /proc/mounts | awk '{print $1, $3, $4}'
          ls /root/.cache | head -4; ls /root/.cache | wc -l
          (echo s > /root/.cache/.arc2141-sweep && rm /root/.cache/.arc2141-sweep && echo WRITE_OK) || echo WRITE_FAIL
